services:
  # 1. Django Backend API (24/7 Free Web Service)
  - type: web
    name: smses-backend
    runtime: python
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TIME_ZONE
        value: "Asia/Aden"
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: smses-db
          property: connectionString

  # 2. React PWA Frontend (24/7 Free Static Site)
  - type: web
    name: smses-app
    runtime: static
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/api/*"
        destination: "https://smses-backend.onrender.com/api/*"
      - type: rewrite
        source: "/media/*"
        destination: "https://smses-backend.onrender.com/media/*"
      - type: rewrite
        source: "/*"
        destination: "/index.html"

databases:
  # 3. PostgreSQL Database (Free Tier)
  - name: smses-db
    region: frankfurt
    plan: free
